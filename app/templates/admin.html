<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 · 许成合的 AI 助手</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    body { background: var(--bg); color: var(--text); margin: 0; }
    .admin-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 1.2rem; background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .admin-brand { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .admin-actions { display: flex; gap: 0.5rem; }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 9px;
      padding: 0.35rem 0.75rem; cursor: pointer;
      text-decoration: none; font-size: 0.85rem;
    }
    .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
    .btn-primary {
      background: var(--primary); color: var(--primary-text);
      border: none; border-radius: 10px; padding: 0.6rem 1.2rem;
      cursor: pointer; font: inherit; font-weight: 600; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .92; }
    .admin-main { max-width: 720px; margin: 1.6rem auto; padding: 0 1rem 3rem; }
    .admin-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.4rem 1.5rem; margin-bottom: 1.1rem;
    }
    .admin-card h3 { margin: 0 0 0.4rem; font-size: 1.02rem; }
    .admin-desc { color: var(--muted); font-size: 0.83rem; margin: 0 0 1rem; line-height: 1.6; }
    .file-row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    input[type="file"] {
      font-size: 0.85rem; color: var(--muted);
      border: 1px dashed var(--border); border-radius: 10px;
      padding: 0.5rem 0.7rem; background: var(--bg); max-width: 100%;
    }
    .result { margin-top: 0.7rem; font-size: 0.86rem; min-height: 1.2em; }
    .result.ok { color: #16a34a; }
    .result.err { color: #dc2626; }
    #sources { margin: 0.4rem 0 0.9rem; padding-left: 1.2rem; font-size: 0.88rem; }
    #sources li { margin: 0.3rem 0; }
  </style>
</head>
<body>
  <header class="admin-topbar">
    <div class="admin-brand">🛠 管理后台</div>
    <div class="admin-actions">
      <a href="/" class="btn-ghost">返回问答</a>
      <a href="/admin/login" class="btn-ghost">重新登录</a>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-card">
      <h3>📄 上传 PDF（实时更新向量库）</h3>
      <p class="admin-desc">解析顺序：MinerU 云端 API → 百度 Paddle → PyMuPDF 本地提取（未配密钥时自动走 PyMuPDF）。上传后切块实时写入 Chroma + BM25，问答即刻生效。</p>
      <div class="file-row">
        <input type="file" id="pdf" accept="application/pdf" aria-label="选择 PDF 文件">
        <button id="upload" class="btn-primary">上传并入库</button>
      </div>
      <div id="upload-result" class="result" role="status"></div>
    </div>

    <div class="admin-card">
      <h3>🗂 已索引来源</h3>
      <ul id="sources"><li>加载中…</li></ul>
      <button id="reindex" class="btn-primary">重建索引（板块 + 已上传文档）</button>
      <div id="reindex-result" class="result" role="status"></div>
    </div>
  </main>

  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();

    function setResult(el, msg, ok) {
      el.textContent = msg;
      el.className = "result " + (ok === undefined ? "" : ok ? "ok" : "err");
    }

    // 加载已索引来源（401/403 说明登录失效，跳回登录页）
    function loadSources() {
      fetch("/api/admin/sources").then(function (r) {
        if (r.status === 401 || r.status === 403) { location.href = "/admin/login"; throw new Error("auth"); }
        return r.json();
      }).then(function (list) {
        var ul = document.getElementById("sources");
        if (!list.length) { ul.innerHTML = "<li>暂无上传文档</li>"; return; }
        ul.innerHTML = list.map(function (d) {
          return "<li><b>" + d.source_name + "</b> · " + d.chunk_count + " 块 · " + d.created_at + "</li>";
        }).join("");
      }).catch(function (e) {
        if (e.message !== "auth") document.getElementById("sources").innerHTML = "<li style='color:red'>加载失败</li>";
      });
    }
    loadSources();

    // 上传 PDF
    document.getElementById("upload").onclick = function () {
      var f = document.getElementById("pdf").files[0];
      var box = document.getElementById("upload-result");
      if (!f) { setResult(box, "请先选择 PDF 文件", false); return; }
      setResult(box, "上传中…（解析 + 切块可能需几秒）");
      var fd = new FormData();
      fd.append("file", f);
      fetch("/api/admin/upload", { method: "POST", body: fd }).then(function (r) {
        if (r.status === 401 || r.status === 403) { location.href = "/admin/login"; throw new Error("auth"); }
        return r.json();
      }).then(function (j) {
        if (j.ok) setResult(box, "✅ 已入库：" + j.source + "，切成 " + j.chunks + " 块", true);
        else setResult(box, "失败：" + j.error, false);
        loadSources();
      }).catch(function (e) { if (e.message !== "auth") setResult(box, "错误：" + e, false); });
    };

    // 重建索引
    document.getElementById("reindex").onclick = function () {
      var box = document.getElementById("reindex-result");
      setResult(box, "重建中…");
      fetch("/api/admin/reindex", { method: "POST" }).then(function (r) {
        if (r.status === 401 || r.status === 403) { location.href = "/admin/login"; throw new Error("auth"); }
        return r.json();
      }).then(function (j) {
        if (j.ok) setResult(box, "✅ 已重建索引，共 " + j.reindexed_chunks + " 块", true);
        else setResult(box, "失败：" + j.error, false);
      }).catch(function (e) { if (e.message !== "auth") setResult(box, "错误：" + e, false); });
    };
  </script>
</body>
</html>
